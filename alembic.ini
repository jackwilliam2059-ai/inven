# Alembic 설정 파일
# 마이그레이션 명령어:
#   alembic init alembic          # 초기화
#   alembic revision --autogenerate -m "설명"  # 마이그레이션 생성
#   alembic upgrade head          # 최신으로 업그레이드
#   alembic downgrade -1          # 롤백

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# SQLAlchemy URL - env.py에서 동적으로 설정됨
sqlalchemy.url = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
